name: OSS Manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Fork branch or ref to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/linkifyjs
          ref: ${{ inputs.target_ref }}

      - name: Report checked-out SHA
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/linkifyjs
          ref: ${{ inputs.target_ref }}

      - name: Report checked-out SHA
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/linkifyjs
          ref: ${{ inputs.target_ref }}

      - name: Report checked-out SHA
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - name: Run coverage
        run: |
          npm run build:ci
          npm run test:coverage
      # Browser tests skipped: upstream gates them on BROWSERSTACK_* secrets
      # (github.secret_source == 'Actions'), absent on this fork.
      # Coveralls upload skipped: fork has no Coveralls project; not a code gate.
